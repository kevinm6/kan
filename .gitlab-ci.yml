stages:
  - docker

variables:
  REGISTRY: ghcr.io
  IMAGE_NAME: "$REGISTRY/$CI_PROJECT_PATH"
  MIGRATE_IMAGE_NAME: "$REGISTRY/${CI_PROJECT_PATH}-migrate"

  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

docker:
  stage: docker

  image: docker:28

  services:
    - docker:28-dind

  before_script:
    - apk add --no-cache bash git curl
    - git fetch --tags

    # Install cosign
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        COSIGN_VERSION="v2.2.4"
        curl -sSL -o /usr/local/bin/cosign \
          "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        chmod +x /usr/local/bin/cosign
      fi

    # Buildx
    - docker buildx create --use --name builder
    - docker buildx inspect --bootstrap

    # Login
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$GHCR_TOKEN" | docker login ghcr.io \
          -u "$GHCR_USERNAME" \
          --password-stdin
      fi

    # Compute version
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        GIT_DESCRIBE=$(git describe --tags --always --long 2>/dev/null || true)

        if [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+-g([a-f0-9]+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}+${BASH_REMATCH[2]:0:7}"

        elif [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}"

        else
          VERSION="${CI_COMMIT_SHORT_SHA}"
        fi
      fi

      echo "VERSION=$VERSION"

    # Compute tags
    - |
      TAGS=""

      if [ -n "$CI_COMMIT_TAG" ]; then
          VERSION="${CI_COMMIT_TAG#v}"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          TAGS="$IMAGE_NAME:$VERSION"
          TAGS="$TAGS,$IMAGE_NAME:$MAJOR.$MINOR"
          TAGS="$TAGS,$IMAGE_NAME:$MAJOR"
          TAGS="$TAGS,$IMAGE_NAME:latest"

          MIGRATE_TAGS="$MIGRATE_IMAGE_NAME:$VERSION"
          MIGRATE_TAGS="$MIGRATE_TAGS,$MIGRATE_IMAGE_NAME:$MAJOR.$MINOR"
          MIGRATE_TAGS="$MIGRATE_TAGS,$MIGRATE_IMAGE_NAME:$MAJOR"
          MIGRATE_TAGS="$MIGRATE_TAGS,$MIGRATE_IMAGE_NAME:latest"

      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then

          TAGS="$IMAGE_NAME:edge"
          MIGRATE_TAGS="$MIGRATE_IMAGE_NAME:edge"

      else

          TAGS="$IMAGE_NAME:${CI_COMMIT_REF_SLUG}"
          MIGRATE_TAGS="$MIGRATE_IMAGE_NAME:${CI_COMMIT_REF_SLUG}"

      fi

      echo "TAGS=$TAGS"
      echo "MIGRATE_TAGS=$MIGRATE_TAGS"

  script:

    # Build normal image
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --file apps/web/Dockerfile \
        --build-arg APP_VERSION="$VERSION" \
        --cache-from type=registry,ref=$IMAGE_NAME:buildcache \
        --cache-to type=registry,ref=$IMAGE_NAME:buildcache,mode=max \
        $(echo "$TAGS" | tr ',' '\n' | sed 's/^/-t /') \
        $( [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ] && echo "--push" ) \
        .

    # Build migrate image
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --target migrate \
        --file apps/web/Dockerfile \
        --build-arg APP_VERSION="$VERSION" \
        --cache-from type=registry,ref=$IMAGE_NAME:buildcache \
        --cache-to type=registry,ref=$IMAGE_NAME:buildcache,mode=max \
        $(echo "$MIGRATE_TAGS" | tr ',' '\n' | sed 's/^/-t /') \
        $( [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ] && echo "--push" ) \
        .

    # Sign
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then

        for tag in $(echo "$TAGS" | tr ',' ' '); do
            cosign sign --yes "$tag"
        done

        for tag in $(echo "$MIGRATE_TAGS" | tr ',' ' '); do
            cosign sign --yes "$tag"
        done
      fi

  rules:
    # Release tags
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

    # Merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

    # Default branch (equivalent to workflow_run after Translate)
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
