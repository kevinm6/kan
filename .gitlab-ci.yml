stages:
  - docker

variables:
  REGISTRY: ghcr.io
  IMAGE_NAME: "$REGISTRY/$CI_PROJECT_PATH"
  MIGRATE_IMAGE_NAME: "$REGISTRY/${CI_PROJECT_PATH}-migrate"

  # Podman storage settings
  BUILDAH_FORMAT: oci
  STORAGE_DRIVER: overlay

docker:
  stage: docker

  image: quay.io/podman/stable:latest

  services:
    - docker:28-dind

  before_script:
    - dnf install -y bash git curl ca-certificates || true
    - podman info
    - git fetch --tags

    # Install cosign
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        COSIGN_VERSION="v2.2.4"
        curl -fsSL -o /usr/local/bin/cosign \
          "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        chmod +x /usr/local/bin/cosign
      fi

    # Login to GHCR
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        echo "$GHCR_TOKEN" | podman login ghcr.io \
          --username "$GHCR_USERNAME" \
          --password-stdin
      fi

    # Compute version
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        GIT_DESCRIBE=$(git describe --tags --always --long 2>/dev/null || true)

        if [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+-g([a-f0-9]+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}+${BASH_REMATCH[2]:0:7}"
        elif [[ "$GIT_DESCRIBE" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          VERSION="${BASH_REMATCH[1]}"
        else
          VERSION="${CI_COMMIT_SHORT_SHA}"
        fi
      fi

      export VERSION
      echo "VERSION=$VERSION"

    # Compute tags
    - |
      TAGS=""
      MIGRATE_TAGS=""

      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"

        MAJOR=$(echo "$VERSION" | cut -d. -f1)
        MINOR=$(echo "$VERSION" | cut -d. -f2)

        TAGS="$IMAGE_NAME:$VERSION"
        TAGS="$TAGS,$IMAGE_NAME:$MAJOR.$MINOR"
        TAGS="$TAGS,$IMAGE_NAME:$MAJOR"
        TAGS="$TAGS,$IMAGE_NAME:latest"

        MIGRATE_TAGS="$MIGRATE_IMAGE_NAME:$VERSION"
        MIGRATE_TAGS="$MIGRATE_TAGS,$MIGRATE_IMAGE_NAME:$MAJOR.$MINOR"
        MIGRATE_TAGS="$MIGRATE_TAGS,$MIGRATE_IMAGE_NAME:$MAJOR"
        MIGRATE_TAGS="$MIGRATE_TAGS,$MIGRATE_IMAGE_NAME:latest"

      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$IMAGE_NAME:edge"
        MIGRATE_TAGS="$MIGRATE_IMAGE_NAME:edge"
      else
        TAGS="$IMAGE_NAME:${CI_COMMIT_REF_SLUG}"
        MIGRATE_TAGS="$MIGRATE_IMAGE_NAME:${CI_COMMIT_REF_SLUG}"
      fi

      export TAGS MIGRATE_TAGS

      echo "TAGS=$TAGS"
      echo "MIGRATE_TAGS=$MIGRATE_TAGS"

  script:
    # Build and optionally push the main multi-architecture image
    - |
      build_manifest() {
        TARGET="$1"
        MANIFEST="$2"
        TAG_LIST="$3"
        DO_PUSH="$4"

        rm -f "$MANIFEST" 2>/dev/null || true
        podman manifest create "$MANIFEST"

        for PLATFORM in linux/amd64 linux/arm64; do
          echo "Building $TARGET for $PLATFORM"

          podman build \
            --platform "$PLATFORM" \
            --manifest "$MANIFEST" \
            --target "$TARGET" \
            --file apps/web/Dockerfile \
            --build-arg APP_VERSION="$VERSION" \
            .
        done

        if [ "$DO_PUSH" = "true" ]; then
          echo "$TAG_LIST" | tr ',' '\n' | while read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Pushing $TAG"
            podman manifest push \
              --all \
              "$MANIFEST" \
              "docker://$TAG"
          done
        fi
      }

      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        PUSH=true
      else
        PUSH=false
      fi

      # The normal target
      build_manifest \
        "" \
        "$IMAGE_NAME:temporary-manifest-$CI_COMMIT_SHORT_SHA" \
        "$TAGS" \
        "$PUSH"

      # The migrate target
      build_manifest \
        "migrate" \
        "$MIGRATE_IMAGE_NAME:temporary-manifest-$CI_COMMIT_SHORT_SHA" \
        "$MIGRATE_TAGS" \
        "$PUSH"

    # Sign pushed tags
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        for TAG in $(echo "$TAGS" | tr ',' ' '); do
          cosign sign --yes "$TAG"
        done

        for TAG in $(echo "$MIGRATE_TAGS" | tr ',' ' '); do
          cosign sign --yes "$TAG"
        done
      fi

  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
